<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Colo Ritmo · Semana (redesign)</title>
  <link rel="stylesheet" href="assets/colors_and_type.css">
  <style>
    /* ============================================================
       Overrides + animações específicas do redesign
       ============================================================ */
    html, body { margin: 0; padding: 0; background: var(--bg-alt); color: var(--ink); font-family: var(--font-body); }
    *, *::before, *::after { box-sizing: border-box; }

    /* Fraunces: optical sizing automático para textos grandes */
    h1, h2, h3, .t-display, .t-h1, .t-h2,
    [style*="--font-display"], [style*="font-display"] {
      font-optical-sizing: auto;
      font-variation-settings: "opsz" 144;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* Handwritten — leve melhoria de renderização */
    [style*="--font-handwritten"], [style*="font-handwritten"] {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    @keyframes colo-pulse-conflict {
      0%, 100% { box-shadow: 0 0 0 0 rgba(199,114,100,0); }
      50%      { box-shadow: 0 0 0 4px rgba(199,114,100,0.20); }
    }
    @keyframes colo-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes colo-drawer-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes colo-drawer-down {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes colo-fab-in {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Scrollbars suaves */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--brand-50);
    }

    /* Logo Colo Ritmo — preencher com lavender da marca */
    img.colo-ritmo-mark { filter: none; }
    .colo-ritmo-mark-inline path { fill: var(--lavender-ink); }
  </style>
